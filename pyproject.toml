[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "servo"
version = "0.2.0"
description = "Local-First, Closed-Loop Neuro-Symbolic Desktop Control Runtime"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Servo Core Engineering Team" }
]
dependencies = [
    "pywin32>=306; sys_platform == 'win32'",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.24.0",
    "Pillow>=9.5.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "anthropic>=2.12.0",
]

[project.optional-dependencies]
mcp = [
    "fastmcp>=0.1.0",
]
# On-device Needle 3 (tool calling) + Mirage (vision). Imports as `cactus`.
cactus = [
    "cactus-compute>=3.3.0",
]
# Playwright browser tier (uses installed Edge/Chrome; `playwright install chromium` for the bundled build)
browser = [
    "playwright>=1.49",
]
# Frameless always-on-top native window for the copilot (falls back to Edge --app)
ui = [
    "pywebview>=5.0",
]
anthropic = [
    "anthropic>=2.12.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "playwright>=1.49",
]

[project.scripts]
servo = "servo.daemon.server:main"

[tool.pytest.ini_options]
markers = [
    "desktop: drives the real Windows desktop (launches apps, moves the mouse); opt in with -m desktop",
]
addopts = "-m 'not desktop'"

[tool.setuptools.package-data]
"servo.daemon" = ["copilot_ui/*.html"]

[tool.setuptools.packages.find]
where = ["."]
include = ["servo*"]
